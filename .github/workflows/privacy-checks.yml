name: Landing privacy checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  cookie-consent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate JavaScript syntax
        run: node --check cookies.js
      - name: Validate landing cookie links and settings
        run: node test-cookie-consent.cjs
