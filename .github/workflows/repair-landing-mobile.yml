name: Repair landing mobile header

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-landing-mobile.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Repair mobile navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          old_css = '''  .mobile-register{display:none;}\n  @media (max-width:880px){\n    nav{align-items:flex-start;gap:12px;}\n    .nav-actions{max-width:270px;}\n    .mobile-register{display:inline-flex;}\n  }\n  @media (max-width:520px){\n    nav{padding:14px 16px;gap:10px;}\n    .logo-text{font-size:1.05rem;}\n    .nav-actions{gap:8px;max-width:235px;}\n    .nav-actions .btn-ghost-nav,.nav-actions .nav-cta{padding:9px 12px;font-size:0.82rem;}\n    .mobile-register{font-weight:700;}\n  }'''

          new_css = '''  .mobile-register{display:none;}\n  @media (max-width:880px){\n    nav{align-items:center;gap:12px;}\n    .nav-actions{gap:8px;max-width:430px;flex-wrap:wrap;}\n    .mobile-register{display:inline-flex;}\n    #open-nosotros,.nav-actions .nav-cta{display:none;}\n    .nav-actions .btn-ghost-nav{padding:9px 12px;font-size:0.82rem;}\n  }\n  @media (max-width:620px){\n    nav{display:grid;grid-template-columns:1fr;padding:13px 16px;gap:10px;}\n    .logo{justify-content:center;}\n    .logo-text{font-size:1.05rem;}\n    .nav-actions{width:100%;max-width:none;display:grid;grid-template-columns:1fr 1fr;gap:8px;}\n    .nav-actions .btn-ghost-nav{justify-content:center;text-align:center;min-height:42px;}\n    #login-link{grid-column:1 / -1;}\n    .mobile-register{font-weight:700;}\n  }\n  @media (max-width:390px){\n    .nav-actions{grid-template-columns:1fr;}\n    #login-link{grid-column:auto;}\n  }'''

          if old_css not in text:
              raise SystemExit('No se encontró el bloque CSS móvil esperado; no se modificó index.html')
          text = text.replace(old_css, new_css, 1)

          old_label = '<a href="registro.html" class="btn-ghost-nav mobile-register">Registrarme</a>'
          if old_label in text:
              text = text.replace(old_label, '<a href="registro.html" class="btn-ghost-nav mobile-register">Quiero usar TiempoLibre</a>', 1)

          required = [
              'href="registro.html" class="btn-ghost-nav mobile-register"',
              'href="repartidores.html" class="btn-ghost-nav mobile-register"',
              'id="login-link"',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Faltan elementos esenciales de navegación: {missing}')

          p.write_text(text, encoding='utf-8')
          PY
      - name: Remove temporary workflows and commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-mobile-registration-label.yml
          rm -f .github/workflows/repair-landing-mobile.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: estabilizar navegación móvil de la landing"
          git push origin main
